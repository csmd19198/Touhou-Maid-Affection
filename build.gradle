buildscript {
    // MixinGradle is applied through its classpath artifact rather than the plugins{} DSL: the
    // plugin marker is not in the offline Gradle cache, the artifact itself (0.7.38) is.
    repositories {
        maven {
            name = 'LocalForgeCache'
            url = 'file:///E:/deepseek/forge-local'
        }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.modrinth.minotaur' version '2.+'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = 'touhou-maid-affection'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Writes touhou_maid_affection.refmap.json next to the classes and points the shipped mixin config
// at it. Without this the @Inject targets stay in their development names (isPassenger) and every
// mixin fails to apply against the SRG runtime - which is exactly how the first 1.20.1 build died.
mixin {
    add sourceSets.main, 'touhou_maid_affection.refmap.json'
    config 'touhou_maid_affection.mixins.json'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'LocalForgeCache'
        url = 'file:///E:/deepseek/forge-local'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Touhou Little Maid - compile only, not bundled
    compileOnly fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")

    // Generates the mixin refmap (see the mixin { } block above).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'touhou_maid_affection.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = project.modrinth_project_id
    versionNumber = "${project.mod_version}+forge1.20.1"
    versionName = "v${project.mod_version} (Forge 1.20.1)"
    versionType = 'release'
    uploadFile = jar
    gameVersions = [project.minecraft_version]
    loaders = ['forge']
    changelog = System.getenv('CHANGELOG') ?: "See https://github.com/yabo083/maid-affection/releases/tag/v${project.mod_version}-forge1.20.1"
    syncBodyFrom = rootProject.file('README.md').text
    dependencies {
        required.project 'touhou-little-maid'
    }
}

tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
